<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="favCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>

  <!-- Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="3.5"/>

  <!-- Glowing Branch Lines -->
  <!-- To Left -->
  <path d="M 64 36 C 64 52, 38 52, 38 72" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round"/>
  <!-- To Right -->
  <path d="M 64 36 C 64 52, 90 52, 90 72" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round"/>

  <!-- Sub-branches -->
  <path d="M 38 72 C 38 86, 26 88, 26 102" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <path d="M 38 72 C 38 86, 50 88, 50 102" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 90 72 C 90 86, 78 88, 78 102" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <path d="M 90 72 C 90 86, 102 88, 102 102" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>

  <!-- Subnodes -->
  <circle cx="26" cy="102" r="6.5" fill="#34d399"/>
  <circle cx="50" cy="102" r="6.5" fill="#38bdf8"/>
  <circle cx="78" cy="102" r="6.5" fill="#fbbf24"/>
  <circle cx="102" cy="102" r="6.5" fill="#c084fc"/>

  <!-- Level 1 Nodes -->
  <circle cx="38" cy="72" r="10.5" fill="#082f49" stroke="#00f2fe" stroke-width="2.5"/>
  <circle cx="38" cy="72" r="5.5" fill="#00f2fe"/>

  <circle cx="90" cy="72" r="10.5" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
  <circle cx="90" cy="72" r="5.5" fill="#818cf8"/>

  <!-- Root Node -->
  <circle cx="64" cy="36" r="15" fill="#0c4a6e" stroke="#00f2fe" stroke-width="3"/>
  <circle cx="64" cy="36" r="8" fill="url(#favCore)"/>
  <circle cx="64" cy="36" r="3.5" fill="#ffffff"/>
</svg>
